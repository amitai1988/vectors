<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>וקטורים · דף מורה</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#172230;--blue:#2B44A0;--blue-l:#EEF2F8;--gray:#8A96A5;--bg:#F4F6FA;--eq:#16935a;--bad:#c92a2a;--warn:#e8590c}
*{box-sizing:border-box}
body{margin:0;font-family:Rubik,system-ui,sans-serif;background:var(--bg);color:var(--navy);line-height:1.7;font-size:16px}
.credit{background:var(--navy);color:#fff;text-align:center;font-size:13.5px;padding:5px}
header{background:#fff;border-bottom:3px solid var(--blue);padding:14px 18px}
header .wrap,main{max-width:1100px;margin:0 auto}
header h1{margin:0;font-size:24px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
input,select,button{font:inherit;font-size:15px}
input,select{padding:6px 10px;border:1px solid #b9c4d6;border-radius:8px}
button{border:1px solid var(--blue);background:var(--blue);color:#fff;border-radius:8px;padding:6px 14px;cursor:pointer}
button.g{background:#fff;color:var(--blue)}
.err{color:var(--bad)}.muted{color:var(--gray);font-size:13.5px}
main{padding:14px 12px 40px}
section{background:#fff;border:1px solid #dde3ec;border-radius:14px;padding:16px 18px;margin:14px 0}
h2{margin:0 0 10px;font-size:19px;color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.kpi{background:var(--blue-l);border-radius:12px;padding:10px 14px}
.kpi .n{font-size:26px;font-weight:700}.kpi .t{font-size:13.5px;color:#4a5566}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px;min-width:720px}
th,td{padding:7px 8px;border-bottom:1px solid #e6eaf1;text-align:right;vertical-align:middle;white-space:nowrap}
th{background:#F7F9FC;font-weight:600;font-size:13.5px;color:#4a5566}
tr.click{cursor:pointer}tr.click:hover{background:#F7F9FC}
.prog{display:flex;align-items:center;gap:6px}
.prog .b{width:110px;height:8px;background:#e6eaf1;border-radius:4px;overflow:hidden}
.prog .b i{display:block;height:100%;background:var(--blue)}
.pill{display:inline-block;border-radius:10px;padding:0 9px;font-size:12.5px;font-weight:600}
.pill.ok{background:#DDF2E3;color:#1c6b3a}.pill.mid{background:#FFF0C2;color:#8a6400}.pill.no{background:#FBE3E3;color:#9b1c1c}.pill.none{background:#eef0f4;color:#8A96A5}
.hard{display:grid;gap:8px}
.hard .it{border:1px solid #e6eaf1;border-radius:10px;padding:8px 12px;display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center}
.hard .lbl{font-weight:600}.hard .who{font-size:13.5px;color:#4a5566}
.bar2{height:10px;background:#e6eaf1;border-radius:5px;overflow:hidden}.bar2 i{display:block;height:100%}
.tl{font-size:14px}
.tl div{padding:4px 0;border-bottom:1px dashed #e6eaf1}
.demo{background:#FFF6DC;color:#8a6400;text-align:center;padding:5px;font-size:14px}
footer{text-align:center;color:var(--gray);font-size:13px;padding:16px}
</style>
</head>
<body>
<div class="credit">פותח על ידי אמתי צוברי · © כל הזכויות שמורות</div>
<header><div class="wrap">
  <h1>קורס וקטורים · דף מורה <a href="index.html" style="font-size:14px;font-weight:400;color:#2B44A0;margin-right:10px">לדף הראשי</a></h1>
  <div class="bar">
    <input type="password" id="key" placeholder="סיסמת מורה">
    <label>שיעור: <select id="lesson"></select></label>
    <button id="load">טעינה</button>
    <button class="g" id="refresh" hidden>רענון</button>
    <span class="muted" id="upd"></span><span class="err" id="err"></span>
  </div>
</div></header>
<main id="main"></main>
<footer>פותח על ידי אמתי צוברי · © כל הזכויות שמורות</footer>
<script src="course-api.js"></script>
<script>
const LESSONS={1:{title:'מהו וקטור?',screens:11,checks:7,basic:10,adv:7}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DATA=null;
$('#lesson').innerHTML=Object.entries(LESSONS).map(([k,v])=>`<option value="${k}">${k} · ${v.title}</option>`).join('');
try{$('#key').value=localStorage.getItem('vec-tkey')||''}catch(e){}

function ago(iso){if(!iso)return '—';const d=new Date(iso),m=(Date.now()-d)/60000;
  if(m<1)return 'עכשיו';if(m<60)return `לפני ${Math.round(m)} דק׳`;if(m<1440)return `לפני ${Math.round(m/60)} שע׳`;
  return d.toLocaleDateString('he-IL',{day:'numeric',month:'numeric'})+' '+d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})}
function pill(v,max){if(v===''||v==null)return '<span class="pill none">לא התחיל</span>';const r=Number(v)/max;
  return `<span class="pill ${r>=.8?'ok':r>=.5?'mid':'no'}">${v} מתוך ${max}</span>`}

async function load(){
  const key=$('#key').value.trim();$('#err').textContent='';
  if(!CourseAPI.live){DATA=demo();$('#main').insertAdjacentHTML('beforebegin','');render();
    if(!document.querySelector('.demo'))document.body.insertBefore(Object.assign(document.createElement('div'),{className:'demo',textContent:'תצוגה מקדימה עם נתוני דוגמה — באתר האמיתי יוצגו נתוני התלמידים'}),document.querySelector('header'));return}
  if(!key){$('#err').textContent='הקלידו סיסמה';return}
  $('#upd').textContent='טוען...';
  try{const r=await fetch(`${CourseAPI.url}?action=teacher&key=${encodeURIComponent(key)}`);const j=await r.json();
    if(!j.ok){$('#err').textContent=j.error||'שגיאה';$('#upd').textContent='';return}
    try{localStorage.setItem('vec-tkey',key)}catch(e){}
    DATA=j;render();$('#refresh').hidden=false;
  }catch(e){$('#err').textContent='אין חיבור לשרת';$('#upd').textContent=''}
}
$('#load').onclick=load;$('#refresh').onclick=load;$('#lesson').onchange=()=>DATA&&render();
$('#key').addEventListener('keydown',e=>{if(e.key==='Enter')load()});

function render(){
  const L=+$('#lesson').value,meta=LESSONS[L];
  const studs=DATA.students.filter(s=>s.cls!=='מורה');
  const prog={};DATA.prog.filter(r=>String(r[2])===String(L)).forEach(r=>prog[String(r[0]).toUpperCase()]=r);
  const log=DATA.log.filter(r=>String(r[3])===String(L));
  $('#upd').textContent='עודכן '+new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
  // KPIs
  const started=studs.filter(s=>prog[s.code]).length,finished=studs.filter(s=>prog[s.code]&&prog[s.code][10]==='כן').length;
  const avg=i=>{const v=studs.map(s=>prog[s.code]&&prog[s.code][i]).filter(x=>x!==''&&x!=null&&x!==undefined).map(Number);return v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):'—'};
  let h=`<section><h2>שיעור ${L} · ${esc(meta.title)} — תמונת מצב</h2><div class="kpis">
    <div class="kpi"><div class="n">${started} מתוך ${studs.length}</div><div class="t">התחילו את השיעור</div></div>
    <div class="kpi"><div class="n">${finished} מתוך ${studs.length}</div><div class="t">סיימו את כל השיעור</div></div>
    <div class="kpi"><div class="n">${avg(6)}</div><div class="t">ממוצע תרגול בסיסי (מתוך ${meta.basic})</div></div>
    <div class="kpi"><div class="n">${avg(8)}</div><div class="t">ממוצע תרגול מתקדם (מתוך ${meta.adv})</div></div></div></section>`;
  // table
  h+=`<section><h2>התקדמות התלמידים</h2><div class="muted">לחיצה על שורה מציגה את כל הפעולות של התלמיד.</div><div class="tw"><table><thead><tr>
    <th>שם</th><th>קוד</th><th>התקדמות במסכים</th><th>מסך אחרון</th><th>בדיקות הבנה</th><th>תרגול בסיסי</th><th>תרגול מתקדם</th><th>סיים</th><th>פעילות אחרונה</th></tr></thead><tbody>`;
  studs.forEach(s=>{const p=prog[s.code];
    if(!p){h+=`<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.code)}</td><td colspan="7"><span class="pill none">עוד לא נכנס לשיעור</span></td></tr>`;return}
    const mx=Number(p[4])||0,chk=String(p[5]||'').split(',').filter(String).length;
    h+=`<tr class="click" data-c="${esc(s.code)}"><td><b>${esc(s.name)}</b></td><td>${esc(s.code)}</td>
      <td><div class="prog"><div class="b"><i style="width:${Math.round(mx/meta.screens*100)}%"></i></div><span dir="ltr">${mx} / ${meta.screens}</span></div></td>
      <td>${esc(p[3])}</td><td>${pill(chk,meta.checks)}</td><td>${pill(p[6],meta.basic)} <span class="muted">${esc(p[7])}</span></td>
      <td>${pill(p[8],meta.adv)} <span class="muted">${esc(p[9])}</span></td><td>${p[10]==='כן'?'✅':''}</td><td>${ago(p[11])}</td></tr>`});
  h+=`</tbody></table></div><div id="detail"></div></section>`;
  // hard items: first attempts
  const items={};
  log.forEach(r=>{const kind=r[4];if(!['בדיקת הבנה','תרגול'].includes(kind))return;
    const label=kind==='תרגול'?'תרגול '+r[6]:'בדיקת הבנה · '+r[5];const k=label;
    const it=items[k]=items[k]||{label,first:{},wrongAny:new Set()};const code=String(r[1]).toUpperCase();
    if(Number(r[8])===1)it.first[code]=r[7]==='כן';if(r[7]==='לא')it.wrongAny.add(r[2])});
  const list=Object.values(items).map(it=>{const v=Object.values(it.first);return {...it,n:v.length,ok:v.filter(Boolean).length}}).filter(it=>it.n>0)
    .sort((a,b)=>a.ok/a.n-b.ok/b.n);
  h+=`<section><h2>איפה היה קשה?</h2><div class="muted">אחוז התלמידים שענו נכון בניסיון הראשון — מהקשה לקל.</div><div class="hard">`;
  if(!list.length)h+='<div class="muted">עוד אין תשובות.</div>';
  list.slice(0,12).forEach(it=>{const pct=Math.round(it.ok/it.n*100);const col=pct>=80?'var(--eq)':pct>=50?'#f0b400':'var(--bad)';
    h+=`<div class="it"><div><div class="lbl">${esc(it.label)}</div><div class="who">${it.wrongAny.size?'טעו לפחות פעם אחת: '+[...it.wrongAny].map(esc).join(', '):'כולם ענו נכון'}</div></div>
      <div><div class="bar2"><i style="width:${pct}%;background:${col}"></i></div><div class="muted">${pct}% (${it.ok} מתוך ${it.n})</div></div></div>`});
  h+='</div></section>';
  $('#main').innerHTML=h;
  document.querySelectorAll('tr.click').forEach(tr=>tr.onclick=()=>detail(tr.dataset.c,log));
}
function detail(code,log){
  const rows=log.filter(r=>String(r[1]).toUpperCase()===code);const s=DATA.students.find(x=>x.code===code);
  $('#detail').innerHTML=`<h2 style="margin-top:16px">${esc(s?s.name:code)} — כל הפעולות (${rows.length})</h2><div class="tl">`+
    (rows.length?rows.slice().reverse().map(r=>`<div><span class="muted">${ago(r[0])}</span> · ${esc(r[4])} · ${esc(r[6]||r[5])} · ${r[7]==='כן'?'✔ נכון':r[7]==='לא'?'✘ לא נכון':''}${r[8]?' · ניסיון '+esc(r[8]):''}${r[9]!==''?' · ניקוד '+esc(r[9]):''}</div>`).join(''):'<div class="muted">אין פעולות.</div>')+'</div>';
  $('#detail').scrollIntoView({behavior:'smooth',block:'start'});
}
function demo(){
  const now=Date.now(),t=m=>new Date(now-m*60000).toISOString();
  const students=[{cls:'יב5',name:'נועה',code:'K7PM'},{cls:'יב5',name:'איתי',code:'R3XT'},{cls:'יב5',name:'מאיה',code:'H9QD'},{cls:'יב5',name:'יונתן',code:'W4ZB'},{cls:'יב5',name:'שירה',code:'A6NV'}];
  const prog=[['K7PM','נועה',1,'תרגול מתקדם',11,'2,3,4,5,6,7,8',9,'10 מתוך 10',6,'7 מתוך 7','כן',t(30)],
    ['R3XT','איתי',1,'תרגול בסיסי',10,'2,3,4,5,6,7,8',6.5,'8 מתוך 10','','','',t(5)],
    ['H9QD','מאיה',1,'וקטורים במקבילית',7,'2,3,4,5,6','','','','','',t(200)],
    ['W4ZB','יונתן',1,'תרגול מתקדם',11,'2,3,4,5,6,7,8',8,'10 מתוך 10',3.5,'5 מתוך 7','',t(60)]];
  const log=[];const add=(m,code,name,kind,scr,q,ok,att,sc)=>log.push([t(m),code,name,1,kind,scr,q,ok,att,sc]);
  [['K7PM','נועה'],['R3XT','איתי'],['H9QD','מאיה'],['W4ZB','יונתן']].forEach(([c,n],i)=>{
    add(300-i*10,c,n,'בדיקת הבנה','שוויון וקטורים','',i%2?'לא':'כן',1,'');if(i%2)add(299-i*10,c,n,'בדיקת הבנה','שוויון וקטורים','','כן',2,'');
    add(250-i*10,c,n,'בדיקת הבנה','וקטורים במקבילית','',i===2?'לא':'כן',1,'');
    if(i!==2){add(100-i*5,c,n,'תרגול','','בסיסי 9',i===1||i===3?'לא':'כן',1,'');add(90-i*5,c,n,'תרגול','','בסיסי 6','כן',1,'')}
    if(i===0||i===3)add(40,c,n,'תרגול','','מתקדם 4',i===3?'לא':'כן',1,'')});
  return {students,prog,log};
}
if(!CourseAPI.live)load();else if($('#key').value)load();
</script>
</body>
</html>
